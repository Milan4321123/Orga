# ==========================================================================
# NPJOE — Blueprint für Render (render.com)
#
# Im Render-Dashboard: New → Blueprint → dieses Repository auswählen.
# Render liest diese Datei und legt den Dienst samt Datenträger an.
# ==========================================================================
services:
  - type: web
    name: npjoe-website
    runtime: node
    plan: starter          # "free" hat KEINEN Datenträger — siehe Hinweis unten
    region: frankfurt      # innerhalb der EU, passend zur Datenschutzerklärung
    branch: main
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /healthz

    # Ohne diesen Datenträger liegen die Daten im flüchtigen Dateisystem und
    # sind nach jedem Deploy verloren — samt aller Beitrittserklärungen.
    disk:
      name: npjoe-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NPJOE_DATA_DIR
        value: /var/data
      - key: NPJOE_ADMIN_PASSWORD
        generateValue: true      # Render würfelt ein sicheres Passwort
      - key: NPJOE_ADMIN_PATH
        sync: false              # geheimer Pfad des Vorstandsbereichs, z. B. vorstand-9f2c71a4
      - key: NPJOE_RATE_LIMIT
        value: "12"
      - key: NPJOE_WEBHOOK_URL
        sync: false              # im Dashboard eintragen, bleibt geheim
      - key: NODE_ENV
        value: production

      # E-Mail-Versand über das Postfach info@progressive-youth.de.
      # Ohne diese Angaben verschickt die Website keine Eingangsbestätigungen,
      # und Newsletter-Anmeldungen lassen sich nicht bestätigen.
      - key: NPJOE_SMTP_HOST
        sync: false              # z. B. smtp.ionos.de, smtp.strato.de
      - key: NPJOE_SMTP_PORT
        value: "587"             # 587 = STARTTLS, 465 = TLS ab dem ersten Byte
      - key: NPJOE_SMTP_USER
        sync: false              # meist die vollständige Adresse
      - key: NPJOE_SMTP_PASS
        sync: false              # Postfachpasswort, bleibt geheim
      - key: NPJOE_MAIL_FROM
        value: info@progressive-youth.de
      - key: NPJOE_MAIL_BOARD
        value: info@progressive-youth.de
      - key: NPJOE_PUBLIC_URL
        value: https://www.progressive-youth.de
